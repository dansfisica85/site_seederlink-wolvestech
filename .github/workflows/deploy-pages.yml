name: Test and deploy GitHub Pages

# Eu valido pull requests e publico automaticamente cada alteração da main.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# Estas são as permissões mínimas necessárias para publicar no GitHub Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Evito duas publicações simultâneas do mesmo site.
concurrency:
  group: pages
  cancel-in-progress: false

# O Vite precisa deste caminho porque o site fica em uma subpasta do GitHub Pages.
env:
  VITE_BASE_PATH: /site_seederlink-wolvestech/

jobs:
  # Este job instala uma versão limpa, testa e gera a pasta dist.
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código do repositório
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Preparar o Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Executar testes
        run: npm test

      - name: Gerar build de produção
        run: npm run build

      # Em pull requests eu paro após validar; a publicação ocorre somente na main.
      - name: Configurar o GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Enviar a build para o GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: dist

  # Este job publica apenas a build que passou por todos os passos anteriores.
  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
